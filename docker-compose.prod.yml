version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dynamic-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dynamic_platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform_user} -d ${POSTGRES_DB:-dynamic_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Gotenberg Service (Free PDF Generation)
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: dynamic-platform-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-web-security"
      - "--chromium-allow-list=file:///*"
      - "--chromium-deny-list=^file:///[^tmp].*"
      - "--chromium-ignore-certificate-errors"
      - "--chromium-disable-routes"
      - "--api-timeout=60s"
      - "--api-root-path=/gotenberg"
    environment:
      # Gotenberg Configuration
      GOTENBERG_API_TIMEOUT: 60s
      GOTENBERG_LOG_LEVEL: INFO
      # Chrome flags for container environment
      GOTENBERG_CHROMIUM_DISABLE_WEB_SECURITY: true
      GOTENBERG_CHROMIUM_ALLOW_LIST: "file:///*"
      GOTENBERG_CHROMIUM_IGNORE_CERTIFICATE_ERRORS: true
    networks:
      - platform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Resource limits for PDF generation
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    # Shared memory for Chrome
    shm_size: 1gb

  # IronPDF Service (External Engine) - REQUIRES PAID LICENSE
  # Note: IronPDF external service requires paid license and Docker Hub access
  # Uncomment and configure if you have IronPDF license
  # ironpdf:
  #   image: ironsoftwareofficial/ironpdf-engine:latest
  #   container_name: dynamic-platform-ironpdf
  #   restart: unless-stopped
  #   environment:
  #     IRONPDF_ENGINE_PORT: 33350
  #     IRONPDF_ENGINE_LOG_LEVEL: INFO
  #     IRONPDF_ENGINE_TIMEOUT: 60000
  #     IRONPDF_ENGINE_ENABLE_LOGGING: true
  #     IRONPDF_ENGINE_MAX_WORKERS: ${IRONPDF_MAX_WORKERS:-4}
  #     IRONPDF_CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=0"
  #   networks:
  #     - platform-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:33350/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 2G
  #         cpus: '2.0'
  #       reservations:
  #         memory: 1G
  #         cpus: '1.0'
    # Shared memory for Chrome
    # shm_size: 2gb

  # Playwright Service (External Engine)
  playwright:
    image: mcr.microsoft.com/playwright:v1.40.0-jammy
    container_name: dynamic-platform-playwright
    restart: unless-stopped
    command: >
      sh -c "
        npm install -g playwright-server &&
        playwright-server --port 3000 --host 0.0.0.0
      "
    environment:
      # Playwright Configuration
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
    networks:
      - platform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    # Resource limits for PDF generation
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    # Shared memory for Chrome
    shm_size: 1gb

  # Backend API Service
  backend:
    image: salahatwa2035/dynamic-platform-api:latest
    container_name: dynamic-platform-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      playwright:
        condition: service_healthy
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod
      
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dynamic_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-platform_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      
      # JPA/Hibernate Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: false
      
      # Server Configuration
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production-min-256-bits}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      
      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,https://yourdomain.com}
      
      # File Upload Configuration
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${MAX_FILE_SIZE:-50MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-50MB}
      
      # IronPDF Configuration - DISABLED (requires license and service)
      IRONPDF_ENABLED: ${IRONPDF_ENABLED:-false}
      IRONPDF_USE_EXTERNAL_ENGINE: ${IRONPDF_USE_EXTERNAL_ENGINE:-false}
      IRONPDF_ENGINE_URL: ${IRONPDF_ENGINE_URL:-}
      IRONPDF_ENGINE_TIMEOUT: ${IRONPDF_ENGINE_TIMEOUT:-60000}
      IRONPDF_LICENSE_KEY: ${IRONPDF_LICENSE_KEY:-}
      
      # Gotenberg Configuration - Free PDF Service (NO licensing required)
      GOTENBERG_ENABLED: ${GOTENBERG_ENABLED:-true}
      GOTENBERG_SERVICE_URL: ${GOTENBERG_SERVICE_URL:-http://gotenberg:3000}
      GOTENBERG_SERVICE_TIMEOUT: ${GOTENBERG_SERVICE_TIMEOUT:-60000}
      
      # Playwright Configuration - External Service (NO local dependencies downloaded)
      PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-true}
      PLAYWRIGHT_USE_EXTERNAL_SERVICE: ${PLAYWRIGHT_USE_EXTERNAL_SERVICE:-true}
      PLAYWRIGHT_SERVICE_URL: ${PLAYWRIGHT_SERVICE_URL:-http://playwright:3000}
      PLAYWRIGHT_SERVICE_TIMEOUT: ${PLAYWRIGHT_SERVICE_TIMEOUT:-60000}
      
      # PDF Engine Selection - Gotenberg preferred (free, high quality)
      PDF_ENGINE: ${PDF_ENGINE:-gotenberg}
      
      # Java Options for Production
      JAVA_OPTS: >-
        -Xms1024m
        -Xmx2048m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+UseStringDeduplication
        -Djava.security.egd=file:/dev/./urandom
        -Dfile.encoding=UTF-8
        -Duser.timezone=UTC
        -XX:+PreferContainerQuotaForCPUCount
        -XX:MaxRAMPercentage=75.0
      
      # Logging Configuration
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_PLATFORM: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
      LOGGING_LEVEL_ORG_HIBERNATE: WARN
      
      # Email Configuration (Optional)
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
      
      # Storage Configuration
      STORAGE_LOCATION: ${STORAGE_LOCATION:-/app/storage}
      
      # Cloud Storage Configuration (Optional)
      CLOUDFLARE_R2_ENABLED: ${CLOUDFLARE_R2_ENABLED:-false}
      CLOUDFLARE_R2_ACCOUNT_ID: ${CLOUDFLARE_R2_ACCOUNT_ID:-}
      CLOUDFLARE_R2_ACCESS_KEY: ${CLOUDFLARE_R2_ACCESS_KEY:-}
      CLOUDFLARE_R2_SECRET_KEY: ${CLOUDFLARE_R2_SECRET_KEY:-}
      CLOUDFLARE_R2_BUCKET_NAME: ${CLOUDFLARE_R2_BUCKET_NAME:-}
      
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      
    volumes:
      # Persistent storage for uploaded files
      - app_storage:/app/storage
      # Persistent storage for logs
      - app_logs:/app/logs
    networks:
      - platform-network
    ports:
      # Only expose if you need direct access (not recommended for production)
      # For production, use a reverse proxy like Nginx or Traefik
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  platform-network:
    driver: bridge
    name: dynamic-platform-network

volumes:
  postgres_data:
    driver: local
    name: dynamic-platform-postgres-data
  app_storage:
    driver: local
    name: dynamic-platform-storage
  app_logs:
    driver: local
    name: dynamic-platform-logs
